project:
  type: website
  output-dir: docs
  render:
    - "**/*.qmd"
    - "!topics/**"
    - "!analysis/**"

website:
  title: "Cabarrus Data Lab"
  site-url: https://cabarrusdatalab.com
  repo-url: https://github.com/pebenbow/cabarrus-data-lab
  repo-actions: [source, issue]
  image: "img/cabarrusdatalab.png"
  open-graph: true # https://quarto.org/docs/websites/website-tools.html#open-graph
  page-footer:
    right: "Made with Quarto"
    background: "#0f1012"
    foreground: "#ffffff"

  navbar:
    right:
      - text: Home
        href: index.qmd
      - text: Research
        href: research/index.qmd
      - text: Stories
        href: stories/index.qmd
      - text: Blog
        href: blog/index.qmd
      - text: Data
        href: data/index.qmd
      - text: About
        href: about.qmd

format:
  html:
    backgroundcolor: "#e6e6e6"
    fontcolor: "black"
    linkcolor: "black"
    mainfont: "Atkinson Hyperlegible"
    theme: [cosmo, styles.scss]
